[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

# Custom domain configuration
[[redirects]]
  from = "https://cultivatedgrowthnetwork.netlify.app/*"
  to = "https://cultivatedgrowthnetwork.com/:splat"
  status = 301
  force = true

# Headers for video files
[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    Content-Type = "video/mp4"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
